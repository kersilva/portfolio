    <style type="text/tailwindcss">
        @theme {
            /* Registramos a variável do brilho que você está usando */
            --drop-shadow-glow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        
        /* Criamos a classe personalizada combinando as classes do Tailwind v4 */
        @utility text-highlight {
            font-weight: var(--font-weight-semibold);
            background-image: linear-gradient(to bottom, var(--color-white), var(--color-stone-300));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(var(--drop-shadow-glow));
        }
    </style>
    
    <style>
        * {
            font-family: 'Alpino', sans-serif;
        }
        
        .boska {
            font-family: 'Boska', serif;
        }
        
        .link-hover {
            position: relative;
            font-weight: 600;
            cursor: pointer;
        }
        
        .link-hover::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 0;
            height: 4px;
            width: 0;
            background-color: white;
            transition: all 300ms ease-in-out;
        }
        
        .link-hover:hover::after {
            width: 100%;
        }

        [data-navbar] {
            position: relative;
        }

        [data-navbar]::before {
            content: attr(data-navbar);
            position: absolute;
            bottom: -40px;
            left: 50%;
            border-radius: 9999px;
            color: white;
            font-size: 1rem;
            transform: translateX(-50%) scale(0);
            border-width: 1px;
            background-color: rgb(255 255 255 / 0.05);
            border-color: rgb(255 255 255 / 0.1);
            width: max-content;
            padding: 0.2rem 1rem;
            opacity: 0;
            transition: all 300ms ease-in-out;
        }

        [data-navbar]:hover::before {
            opacity: 1;
            bottom: -50px;
            transform: translateX(-50%) scale(1);
        }

        [data-navbar] i.icon-outline {
            opacity: 1;
            transition: all 300ms ease-in-out;
        }

        [data-navbar] i.icon-fill {
            position: absolute;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
            opacity: 0;
            transition: all 300ms ease-in-out;
        }

        [data-navbar]:hover i.icon-outline {
            opacity: 0;
        }

        [data-navbar]:hover i.icon-fill {
            opacity: 1;
        }
    </style>
</head>
